# tmux config — symlinked to ~/.config/tmux/tmux.conf (tmux 3.1+)
# Tuned for an agentic dev workflow: persistent sessions, truecolor for nvim,
# easy splits, mouse on.

# ── Prefix: C-b → C-a (easier reach, frees C-b) ──────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Colors: pass truecolor through to nvim ───────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,wezterm:RGB"

# ── Sane defaults ────────────────────────────────────────────
set -g mouse on                 # click panes, drag to resize, scroll
set -g history-limit 50000
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10          # don't lag the Esc key in nvim
set -g focus-events on          # let nvim know about focus
set -g set-clipboard on         # yank to system clipboard

# ── Splits that keep the current path ────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── vi-style navigation ──────────────────────────────────────
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config without restarting tmux
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# ── Status bar (minimal) ─────────────────────────────────────
set -g status-position top
set -g status-style "bg=default,fg=white"
set -g status-left "#[bold]#S "
set -g status-left-length 30
set -g status-right "%H:%M %d-%b"
setw -g window-status-current-style "bold"
